# Defaults for every spark-submit run from the spark-client container.
# Anything here can be overridden per job with --conf key=value.

# Where the cluster is
spark.master                    spark://spark-master:7077
spark.hadoop.fs.defaultFS       hdfs://namenode:8020

# GraphFrames is not part of Spark: download it (and its Python wrapper) on first run.
spark.jars.packages             graphframes:graphframes:0.8.4-spark3.5-s_2.12
spark.jars.repositories         https://repos.spark-packages.org
spark.jars.ivy                  /tmp/.ivy2

# Sized for a laptop: 2 workers x (2 cores, 2 GB). Each executor gets 1 GB.
spark.driver.memory             1g
spark.executor.memory           1g
# Default is 200 shuffle partitions, too many for small graphs. About 2x total cores.
spark.sql.shuffle.partitions    8
