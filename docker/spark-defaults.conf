# Defaults for every spark-submit run from the spark-client container.
# Anything here can be overridden per job with --conf key=value.

# Where the cluster is
spark.master                    spark://spark-master:7077
spark.hadoop.fs.defaultFS       hdfs://namenode:8020

# GraphFrames is not part of Spark: download it (and its Python wrapper) on first run.
spark.jars.packages             graphframes:graphframes:0.8.4-spark3.5-s_2.12
spark.jars.repositories         https://repos.spark-packages.org
spark.jars.ivy                  /tmp/.ivy2

# Sized for a laptop: 2 workers x (2 cores, 2 GB). Each executor gets 1 GB.
spark.driver.memory             1g
spark.executor.memory           1g
# Default is 200 shuffle partitions, too many for small graphs. About 2x total cores.
spark.sql.shuffle.partitions    8

# --- Networking: fixed names and ports, so executors on other PCs can reach us ---
# (Phase 2. On one machine these change nothing: the names resolve inside Docker.)
# Executors connect BACK to the driver: tell them its name, not its container IP.
spark.driver.host               spark-client
# Spark picks random ports by default; other PCs can only reach ports we publish,
# so pin them. The same numbers are in docker-compose*.yml and scripts\open_firewall.ps1.
spark.driver.port               7080
spark.driver.blockManager.port  7081
# Every executor (one per worker/PC) serves its shuffle data on this port.
spark.blockManager.port         7079
# HDFS: the NameNode answers "block X is on datanode <IP>", but that IP is a
# container IP. Use the DataNode's hostname instead, which every PC can resolve.
spark.hadoop.dfs.client.use.datanode.hostname   true
# Files Spark writes get 2 copies on 2 PCs (the writer decides, so set it here too;
# without this Spark would ask for Hadoop's default of 3).
spark.hadoop.dfs.replication    2
# Note: run ONE job at a time in Phase 2. A second driver or a second executor on the
# same worker would move to port +1, which is not published.
