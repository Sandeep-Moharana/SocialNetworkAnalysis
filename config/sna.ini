# Application settings: WHERE our data lives in HDFS and WHAT each dataset looks like.
#
# Cluster settings (Spark master URL, NameNode address, memory) are NOT here.
# They live in docker/spark-defaults.conf, so moving to a multi-PC cluster changes
# that file only. The paths below have no host part ("/sna/...", not "hdfs://host/sna"),
# so Spark resolves them against whatever fs.defaultFS the cluster uses.

[paths]
root        = /sna
raw         = ${root}/raw
processed   = ${root}/processed
output      = ${root}/output
checkpoints = ${root}/checkpoints

# One section per dataset: [dataset.<name>]. Files live at ${paths:raw}/<name>/<file>.
#   directed       true  = "a b" means a -> b (follows, trust)
#                  false = "a b" is a two-way friendship; we store both directions
#   comment_prefix lines starting with this are skipped (SNAP headers start with #)
#   separator      regex between the two ids on a line (\s+ = any spaces or tabs)

[dataset.facebook]
# SNAP ego-Facebook: 4,039 users, 88,234 friendships
file           = facebook_combined.txt
directed       = false
comment_prefix = #
separator      = \s+
