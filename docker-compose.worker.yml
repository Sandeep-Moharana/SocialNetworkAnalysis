# Phase 2: runs on a FRIEND's PC.
#   spark-worker  "worker-<NODE_NAME>"   computes: runs Spark executors for the master
#   datanode      "datanode-<NODE_NAME>" stores:   holds HDFS blocks (2 copies on 2 PCs)
#
#   .\scripts\worker_up.ps1               worker + DataNode
#   .\scripts\worker_up.ps1 -NoStorage    worker only (computing, no HDFS storage)
#   = docker compose -f docker-compose.worker.yml [--profile storage] up -d
#
# NODE_NAME and DATANODE_PORT come from .env (copy .env.worker.example). The IPs
# (MASTER_IP, OTHER_FRIEND_IP) are written into .env by worker_up.ps1, which asks
# the master's registry. Guide: docs/PHASE2_SETUP.md.
#
# How the networking works (Docker on Windows hides containers behind NAT):
#   - Each service introduces itself by NAME. On this PC the name means the
#     container itself (hostname / network alias); on every other PC, extra_hosts
#     maps it to THIS PC's Wi-Fi IP, and the published ports forward to the container.
#   - Ports are the same number on both sides ("7078:7078"), because the number is
#     part of the address each service announces.
#   - Never add this PC's own names to extra_hosts: the service could not start
#     ("Cannot assign requested address") or would talk to itself the long way.
#
# This PC needs no code updates: every job sends our Python package and GraphFrames
# to the executors. Pull + restart only when the files in docker/ or this file change.
name: sna-worker

services:
  spark-worker:
    image: sna-spark:3.5.3              # same image as the master laptop: same Spark, Java, Python
    build: ./docker/spark
    hostname: worker-${NODE_NAME:?set NODE_NAME in .env}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077",
              "--host", "worker-${NODE_NAME}",
              "--port", "7078",
              "--cores", "${WORKER_CORES:-2}", "--memory", "${WORKER_MEMORY:-2g}",
              "--work-dir", "/tmp/spark-work"]
    ports:
      - "7078:7078"   # worker RPC: the master starts executors here
      - "7079:7079"   # executor block manager: shuffle data for the other PCs
      - "8081:8081"   # worker web UI -> http://<this PC's IP>:8081
    extra_hosts:
      # Everything on the master laptop:
      - "spark-master:${MASTER_IP:?set MASTER_IP in .env}"
      - "spark-client:${MASTER_IP}"     # the driver: executors fetch tasks + code here
      - "spark-worker-1:${MASTER_IP}"   # the master laptop's own worker (shuffle data)
      - "namenode:${MASTER_IP}"         # HDFS metadata
      - "datanode:${MASTER_IP}"         # the master laptop's DataNode
      # The other friend's PC (shuffle data + HDFS blocks):
      - "worker-${OTHER_FRIEND:?set OTHER_FRIEND in .env}:${OTHER_FRIEND_IP:?set OTHER_FRIEND_IP in .env}"
      - "datanode-${OTHER_FRIEND}:${OTHER_FRIEND_IP}"
      # (Our own datanode-<NODE_NAME> is found through its network alias below.)
    restart: unless-stopped             # comes back by itself after a laptop reboot

  datanode:
    profiles: ["storage"]               # only started with --profile storage (worker_up.ps1 does, unless -NoStorage)
    image: apache/hadoop:3.3.6
    hostname: datanode-${NODE_NAME}
    command: ["bash", "/opt/sna-hdfs/start-datanode.sh"]
    env_file: ./docker/hadoop.env       # same HDFS settings as the master laptop ...
    environment:                        # ... except this DataNode's name and ports.
      HDFS-SITE.XML_dfs.datanode.hostname: datanode-${NODE_NAME}
      # The NameNode sees every remote DataNode arriving from the SAME address
      # (Docker's NAT on the master laptop) and tells them apart by address + data
      # port. So each friend needs a DIFFERENT data port (alice 9876, bob 9886, ...).
      HDFS-SITE.XML_dfs.datanode.address: 0.0.0.0:${DATANODE_PORT:?set DATANODE_PORT in .env}
      HDFS-SITE.XML_dfs.datanode.ipc.address: 0.0.0.0:${DATANODE_IPC_PORT:-9867}
      HDFS-SITE.XML_dfs.datanode.http.address: 0.0.0.0:${DATANODE_HTTP_PORT:-9864}
    ports:
      - "${DATANODE_PORT}:${DATANODE_PORT}"                       # block data
      - "${DATANODE_IPC_PORT:-9867}:${DATANODE_IPC_PORT:-9867}"   # DataNode IPC (block recovery)
      - "${DATANODE_HTTP_PORT:-9864}:${DATANODE_HTTP_PORT:-9864}" # DataNode web UI
    volumes:
      - ./docker/hdfs:/opt/sna-hdfs:ro
      - hdfs-data:/hdfs                 # this PC's blocks survive restarts
    extra_hosts:
      - "namenode:${MASTER_IP}"         # heartbeats + block reports go here
      - "datanode:${MASTER_IP}"         # the 2nd copy of a block may go to the master's DataNode ...
      - "datanode-${OTHER_FRIEND}:${OTHER_FRIEND_IP}"   # ... or to the other friend's
    networks:
      default:
        aliases: ["datanode-${NODE_NAME}"]   # so OUR spark-worker reaches it directly
    restart: unless-stopped

volumes:
  hdfs-data:
