# Phase 1 cluster: everything runs on ONE machine, but each "node" is its own
# container, so this is a real (small) distributed setup.
#
#   docker compose up -d      start the cluster
#   docker compose ps         see what's running
#   docker compose stop       stop
#   docker compose down       stop and delete the containers. HDFS data is KEPT
#                             (it lives on the volumes hdfs-name + hdfs-data)
#   docker compose down -v    ... and DELETE the HDFS data too (then re-run
#                             scripts\load_to_hdfs.ps1)
#
# Phase 2 (friends' PCs as workers) reuses this file plus docker-compose.cluster.yml:
# run scripts\cluster_up.ps1. Guide: docs/PHASE2_SETUP.md.
#
# Multi-PC rules, already followed here so Phase 1 and Phase 2 share one file:
#   1. Every Spark/HDFS process introduces itself by NAME (hostname + --host),
#      never by its container IP (172.x), which only exists on this laptop.
#   2. Every port other PCs connect to is FIXED and published with the SAME
#      number on both sides ("7079:7079"). On one machine this changes nothing.
name: sna

# All Spark services use OUR image: official Spark + Python packages
# (see docker/spark/Dockerfile). Built locally on the first 'up --build'.
x-spark-image: &spark_image sna-spark:3.5.3
x-spark-build: &spark_build ./docker/spark

services:
  # ------------------------------------------------------------------
  # Storage layer: HDFS
  # ------------------------------------------------------------------
  namenode:                       # keeps the file-system metadata (which blocks are where)
    image: apache/hadoop:3.3.6
    hostname: namenode
    # Our start script: formats HDFS on the very first start only, then runs the NameNode.
    command: ["bash", "/opt/sna-hdfs/start-namenode.sh"]
    env_file: ./docker/hadoop.env
    ports:
      - "9870:9870"               # HDFS web UI -> http://localhost:9870
      - "8020:8020"               # HDFS metadata RPC: executors + DataNodes on other PCs connect here
    volumes:
      - ./data:/data              # host data/ folder, used by 'hdfs dfs -put'
      - ./docker/hdfs:/opt/sna-hdfs:ro
      - hdfs-name:/hdfs           # metadata survives container re-creation

  datanode:                       # stores the actual data blocks
    image: apache/hadoop:3.3.6
    hostname: datanode
    command: ["bash", "/opt/sna-hdfs/start-datanode.sh"]
    env_file: ./docker/hadoop.env
    ports:
      - "9866:9866"               # block data: other PCs read/write blocks here
      - "9867:9867"               # DataNode IPC: other DataNodes (block recovery)
    volumes:
      - ./docker/hdfs:/opt/sna-hdfs:ro
      - hdfs-data:/hdfs           # blocks survive container re-creation
    depends_on: [namenode]

  # ------------------------------------------------------------------
  # Compute layer: Spark standalone cluster
  # ------------------------------------------------------------------
  spark-master:                   # hands out executors to applications
    image: *spark_image
    build: *spark_build
    hostname: spark-master
    # --host: advertise the name "spark-master" (default would be the container IP).
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master"]
    ports:
      - "8080:8080"               # Spark master UI -> http://localhost:8080
      - "7077:7077"               # workers on other PCs register here

  spark-worker-1:                 # runs executors (the processes that do the work)
    image: *spark_image
    build: *spark_build
    hostname: spark-worker-1
    # --host: the worker AND its executors introduce themselves by this name.
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--host", "spark-worker-1",
              "--cores", "2", "--memory", "2g", "--work-dir", "/tmp/spark-work"]
    ports:
      - "8081:8081"
      - "7079:7079"               # executor block manager (spark.blockManager.port): shuffle data for other PCs
    depends_on: [spark-master]

  spark-worker-2:                 # Phase 1 only. Phase 2 = one worker per PC (cluster_up.ps1 turns this off)
    image: *spark_image
    build: *spark_build
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--host", "spark-worker-2",
              "--cores", "2", "--memory", "2g", "--work-dir", "/tmp/spark-work"]
    ports:
      - "8082:8081"               # no 7079 here: the laptop's port 7079 already belongs to spark-worker-1
    depends_on: [spark-master]

  spark-client:                   # "edge node": where our Python driver programs run
    image: *spark_image
    build: *spark_build
    hostname: spark-client
    command: ["tail", "-f", "/dev/null"]   # stay alive; we 'exec' spark-submit into it
    working_dir: /app
    ports:
      - "4040:4040"               # UI of the currently running job -> http://localhost:4040
      - "7080:7080"               # driver RPC (spark.driver.port): executors fetch tasks + our code here
      - "7081:7081"               # driver block manager (spark.driver.blockManager.port)
    volumes:
      - ./:/app                   # our code (jobs/, src/) is visible inside the container
      - ./docker/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on: [spark-master, namenode]

# HDFS lives here, outside the containers: kept by "docker compose down",
# deleted only by "docker compose down -v".
volumes:
  hdfs-name:
  hdfs-data:
